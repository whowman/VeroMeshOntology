# DataHub for the dev install, on top of deploy/helm/datahub/datahub-values.yaml: the
# VeroMesh images from the registry (the workflow sets it), small resources, and no
# DataHub tokens. GMS and the UI stay inside the cluster: reach the UI with
# kubectl -n veromesh-dev port-forward svc/datahub-datahub-frontend 9002:9002.
global:
  datahub:
    # Dev only: GMS is reachable only inside the cluster, so VeroMesh calls it without a token.
    metadata_service_authentication:
      enabled: false
datahub-gms:
  nodeSelector: {workload: veromesh}
  # DataHub 1.8 needs the system client's secret even with token authentication off, and
  # chart 1.1.9 passes it only when authentication is on: pass it here. Helm replaces lists,
  # so the theme settings from datahub-values.yaml are repeated (tests/helm checks they match).
  extraEnvs:
    - name: REACT_APP_CUSTOM_THEME_ID
      value: veromesh.theme.json
    - name: REACT_APP_LOGO_URL
      value: assets/veromesh/veromesh-mark.svg
    - name: REACT_APP_FAVICON_URL
      value: assets/veromesh/favicon.ico
    - name: REACT_APP_TITLE
      value: VeroMesh
    - name: DATAHUB_SYSTEM_CLIENT_ID
      value: __datahub_system
    - name: DATAHUB_SYSTEM_CLIENT_SECRET
      valueFrom:
        secretKeyRef: {name: datahub-auth-secrets, key: system_client_secret}
  resources:
    requests: {cpu: 250m, memory: 1536Mi}
    limits: {memory: 2Gi}
datahub-frontend:
  nodeSelector: {workload: veromesh}
  # DataHub 1.8 needs the system client's secret even with token authentication off, and
  # chart 1.1.9 passes it only when authentication is on: pass it here. Helm replaces lists,
  # so the theme settings from datahub-values.yaml are repeated (tests/helm checks they match).
  extraEnvs:
    - name: REACT_APP_CUSTOM_THEME_ID
      value: veromesh.theme.json
    - name: REACT_APP_LOGO_URL
      value: assets/veromesh/veromesh-mark.svg
    - name: REACT_APP_FAVICON_URL
      value: assets/veromesh/favicon.ico
    - name: REACT_APP_TITLE
      value: VeroMesh
    - name: DATAHUB_SYSTEM_CLIENT_ID
      value: __datahub_system
    - name: DATAHUB_SYSTEM_CLIENT_SECRET
      valueFrom:
        secretKeyRef: {name: datahub-auth-secrets, key: system_client_secret}
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
acryl-datahub-actions:
  nodeSelector: {workload: veromesh}
  extraEnvs:  # as for GMS above
    - name: DATAHUB_SYSTEM_CLIENT_ID
      value: __datahub_system
    - name: DATAHUB_SYSTEM_CLIENT_SECRET
      valueFrom:
        secretKeyRef: {name: datahub-auth-secrets, key: system_client_secret}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
datahub-mae-consumer:
  nodeSelector: {workload: veromesh}
datahub-mce-consumer:
  nodeSelector: {workload: veromesh}
# DataHub's one-off set-up jobs on the same nodes, so nothing of the ontology tool ever
# runs on the assessment's nodes (and all of it stops when the pool is off).
elasticsearchSetupJob:
  nodeSelector: {workload: veromesh}
kafkaSetupJob:
  nodeSelector: {workload: veromesh}
postgresqlSetupJob:
  nodeSelector: {workload: veromesh}
datahubUpgrade:
  nodeSelector: {workload: veromesh}
datahubSystemUpdate:
  nodeSelector: {workload: veromesh}
  # DataHub 1.8's system update needs the system client's secret even with token
  # authentication off, and the chart passes it only when authentication is on. The
  # chart still creates the secret (provisionSecrets) before the job runs.
  extraEnvs:
    - name: DATAHUB_SYSTEM_CLIENT_ID
      value: __datahub_system
    - name: DATAHUB_SYSTEM_CLIENT_SECRET
      valueFrom:
        secretKeyRef: {name: datahub-auth-secrets, key: system_client_secret}
