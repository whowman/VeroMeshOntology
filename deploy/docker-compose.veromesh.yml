# Veromesh services. Runs alongside DataHub's own compose stack (started by
# scripts/dev-up.sh) and joins its network so it can reach datahub-gms.
name: veromesh

services:
  fuseki:
    build:
      context: fuseki
      args:
        JENA_VERSION: ${JENA_VERSION:-6.2.0}
    image: veromesh/fuseki:${JENA_VERSION:-6.2.0}
    environment:
      FUSEKI_DATASET: veromesh
      JAVA_OPTS: ${VEROMESH_FUSEKI_JAVA_OPTS:--Xmx1g}
    ports:
      # Bound to localhost: Fuseki has no authentication in this setup.
      - "127.0.0.1:${VEROMESH_FUSEKI_PORT:-3030}:3030"
    volumes:
      - fuseki-data:/fuseki/databases
    restart: unless-stopped

  veromesh-service:
    build:
      context: ..
      dockerfile: service/Dockerfile
    environment:
      VEROMESH_DATAHUB_GMS_URL: http://datahub-gms:8080
      VEROMESH_DATAHUB_TOKEN: ${VEROMESH_DATAHUB_TOKEN:-}
      VEROMESH_RDF_STORE: fuseki:http://fuseki:3030/veromesh
    ports:
      - "${VEROMESH_SERVICE_PORT:-8700}:8700"
    depends_on:
      fuseki:
        condition: service_healthy
    restart: unless-stopped

  # Spreadsheet loader: a client of the REST API. Run it with scripts/veromesh-loader.sh.
  loader:
    profiles: ["tools"]
    build:
      context: ../loader
    image: veromesh/loader:local
    environment:
      VEROMESH_API: http://veromesh-service:8700
      VEROMESH_TOKEN: ${VEROMESH_TOKEN:-}

volumes:
  fuseki-data:

networks:
  default:
    name: datahub_network
    external: true
