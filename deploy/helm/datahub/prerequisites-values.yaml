# Overlay for DataHub's official prerequisites chart (datahub/datahub-prerequisites,
# pinned in deploy/helm/versions.env). Same storage as the local stack:
# PostgreSQL and OpenSearch. Kafka replaces pgQueue on Kubernetes, as the
# reference architecture plans for production; it also carries the VeroMesh
# knowledge graph's change log (topic veromesh.graph) from the writer Fuseki to
# its read replicas.
#
#   kubectl create secret generic postgresql-secrets \
#     --from-literal=postgres-password=... --from-literal=replication-password=... --from-literal=password=...
#   helm install prerequisites datahub/datahub-prerequisites \
#     --version $DATAHUB_PREREQUISITES_CHART_VERSION -f deploy/helm/datahub/prerequisites-values.yaml
#
# This runs everything as single nodes, which suits a pilot. In production use
# managed PostgreSQL, OpenSearch and Kafka instead and set enabled: false here.

mysql:
  enabled: false

postgresql:
  enabled: true
  auth:
    existingSecret: postgresql-secrets

opensearch:
  enabled: true
  singleNode: true
  # The OpenSearch chart's templates read this key; its own defaults do not set it.
  serviceMonitor:
    enabled: false

kafka:
  enabled: true
  controller:
    # The chart's single-node settings, restated (this string replaces the
    # chart's), plus what Kafka transactions need on one broker: the VeroMesh
    # writer publishes each commit in a transaction.
    extraConfig: |
      default.replication.factor=1
      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
      transaction.state.log.min.isr=1
      min.insync.replicas=1
      message.max.bytes=5242880
