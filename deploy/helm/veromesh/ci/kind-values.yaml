# Used by the k8s suite (tests/k8s/kind_smoke.sh): images loaded into kind,
# small requests so it fits a CI runner, no DataHub in the cluster. Replication
# goes through the single-node Kafka the smoke test starts (service "kafka").
api:
  image:
    tag: test
    pullPolicy: Never
  datahub:
    gmsUrl: http://datahub-not-installed:8080
  # The smoke test calls the API without an identity provider in the cluster.
  auth:
    disabled: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  # The PostgreSQL the smoke test starts (tests/k8s/postgres.yaml).
  decisionLog:
    existingSecret: veromesh-decision-log
fuseki:
  image:
    tag: test
    pullPolicy: Never
  javaOpts: "-Xmx512m"
  persistence:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
  replication:
    replicas: 2
    kafka:
      bootstrapServers: kafka:9092
      replicationFactor: 1
backup:
  image:
    tag: test
    pullPolicy: Never
  # The smoke test replaces this with a key it generates, so it can restore.
  encryption:
    recipients: [age129qez9lp8qakwpaapv7af6ncqzw0g8a5lz4k9elc6njem29j0afs2v8mx9]
  # Created by the smoke test (tests/k8s/backup-pvc.yaml).
  volume:
    existingClaim: veromesh-backups
  workSize: 512Mi
