# helm test <release>: the service answers and, with sign-in off, reads its schema and the
# knowledge graph; with sign-in on, it refuses a request without a token.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "veromesh.fullname" . }}-test
  labels:
    {{- include "veromesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
    {{- if .Values.mesh.enabled }}
    istio.io/dataplane-mode: ambient
    {{- end }}
  annotations:
    helm.sh/hook: test
    # Kept after a run so `helm test --logs` can read it; replaced on the next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: {{ include "veromesh.apiImage" . | quote }}
      imagePullPolicy: {{ .Values.api.image.pullPolicy }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "veromesh.apiName" . }}:{{ .Values.api.service.port }}"
          def get(path):
              with urllib.request.urlopen(base + path, timeout=30) as r:
                  return json.load(r)
          import time
          # Right after an install the Service's endpoints can lag the pod by a few seconds.
          for attempt in range(30):
              try:
                  health = get("/health")
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(2)
          assert health["status"] == "ok"
          {{- if .Values.api.auth.disabled }}
          assert any(t["type"] == "roles" for t in get("/api/v1/schema")), "schema has no roles"
          # Reads the source registry from the knowledge graph.
          print("sources:", get("/api/v1/sources"))
          {{- else }}
          import urllib.error
          try:
              get("/api/v1/sources")
              raise SystemExit("the API answered without a token")
          except urllib.error.HTTPError as e:
              assert e.code == 401, f"expected 401 without a token, got {e.code}"
          print("sign-in enforced")
          {{- end }}
          print("ok")
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
