{{- if .Values.fuseki.enabled }}
{{- $replicated := include "veromesh.replicated" . -}}
{{- $r := .Values.fuseki.replication -}}
{{- $sel := include "veromesh.selectorLabels" (list . "fuseki") -}}
{{- $replicaSel := include "veromesh.selectorLabels" (list . "fuseki-replica") -}}
{{- /*
  Apache Jena Fuseki with a persistent TDB2 dataset.
  Single node (replication off): one Fuseki takes reads and writes.
  Replicated: this StatefulSet is the writer; the read replicas below follow it
  through Kafka. The writer keeps its name, so its volume (the model) is the
  same in both setups.
*/}}
{{- range $role := (ternary (list "writer" "replica") (list "writer") (eq $replicated "true")) }}
{{- $isReplica := eq $role "replica" }}
{{- with $ }}
{{- $name := ternary (include "veromesh.fusekiReplicaName" .) (include "veromesh.fusekiName" .) $isReplica }}
{{- $component := ternary "fuseki-replica" "fuseki" $isReplica }}
{{- $s := ternary $replicaSel $sel $isReplica }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "veromesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ ternary $r.replicas 1 $isReplica }}
  serviceName: {{ $name }}-headless
  # Replicas start together; each catches up from Kafka on its own.
  podManagementPolicy: {{ ternary "Parallel" "OrderedReady" $isReplica }}
  selector:
    matchLabels:
      {{- $s | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "veromesh.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        {{- if $replicated }}
        # Restart when the Fuseki configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/fuseki-config.yaml") . | sha256sum | trunc 16 }}
        {{- end }}
        {{- with .Values.fuseki.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      # TDB2 holds a lock on its folder; let the old pod stop cleanly first.
      terminationGracePeriodSeconds: 60
      containers:
        - name: fuseki
          image: "{{ .Values.fuseki.image.repository }}:{{ .Values.fuseki.image.tag }}"
          imagePullPolicy: {{ .Values.fuseki.image.pullPolicy }}
          env:
            - name: FUSEKI_DATASET
              value: {{ .Values.fuseki.dataset | quote }}
            - name: JAVA_OPTS
              value: {{ .Values.fuseki.javaOpts | quote }}
            {{- if $replicated }}
            - name: FUSEKI_CONFIG
              value: /etc/fuseki/{{ $role }}.ttl
            {{- end }}
            {{- if $isReplica }}
            - name: REPLICA_ID_FILE
              value: /fuseki/databases/replica-id
            {{- end }}
          ports:
            - name: http
              containerPort: 3030
              protocol: TCP
          startupProbe:
            httpGet:
              path: /$/ping
              port: http
            periodSeconds: 5
            # A writer or a new replica first catches up with Kafka.
            failureThreshold: {{ ternary 180 36 (eq $replicated "true") }}
          readinessProbe:
            httpGet:
              path: /$/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /$/ping
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /fuseki/databases
            {{- if $replicated }}
            - name: config
              mountPath: /etc/fuseki
              readOnly: true
            {{- if $r.kafka.existingSecret }}
            - name: kafka
              mountPath: /etc/fuseki/kafka
              readOnly: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.fuseki.resources | nindent 12 }}
      {{- if or (not .Values.fuseki.persistence.enabled) $replicated }}
      volumes:
        {{- if not .Values.fuseki.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if $replicated }}
        - name: config
          configMap:
            name: {{ include "veromesh.fusekiName" . }}-config
        {{- if $r.kafka.existingSecret }}
        - name: kafka
          secret:
            secretName: {{ $r.kafka.existingSecret }}
            items:
              - key: kafka.properties
                path: kafka.properties
        {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.fuseki.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fuseki.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.fuseki.affinity }}
      affinity:
        {{- toYaml .Values.fuseki.affinity | nindent 8 }}
      {{- else if $replicated }}
      # Prefer spreading the writer and replicas over nodes, so one node going down
      # leaves a copy to read from.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values: [{{ .Release.Name | quote }}]
                    - key: app.kubernetes.io/component
                      operator: In
                      values: ["fuseki", "fuseki-replica"]
      {{- end }}
  {{- if .Values.fuseki.persistence.enabled }}
  # Kept when the release is uninstalled: delete the PVC to discard the model.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- $s | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.fuseki.persistence.accessModes | nindent 10 }}
        {{- with .Values.fuseki.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.fuseki.persistence.size | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ ternary (include "veromesh.fusekiReplicasService" .) (include "veromesh.fusekiName" .) $isReplica }}
  labels:
    {{- include "veromesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- $s | nindent 4 }}
  ports:
    - name: http
      port: 3030
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "veromesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  clusterIP: None
  selector:
    {{- $s | nindent 4 }}
  ports:
    - name: http
      port: 3030
      targetPort: http
      protocol: TCP
---
{{- end }}
{{- end }}
{{- if and $replicated (ge (int $r.replicas) 2) }}
# Keep at least one read replica up through node drains and upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "veromesh.fusekiReplicaName" . }}
  labels:
    {{- include "veromesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: fuseki-replica
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- $replicaSel | nindent 6 }}
---
{{- end }}
{{- if .Values.networkPolicy.enabled }}
# Fuseki has no authentication: only the VeroMesh service may reach the writer
# or the replicas. (The replicas reach Kafka; this policy limits ingress only.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veromesh.fusekiName" . }}
  labels:
    {{- include "veromesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: fuseki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "veromesh.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["fuseki", "fuseki-replica"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "veromesh.selectorLabels" (list . "api") | nindent 14 }}
        {{- with .Values.networkPolicy.fusekiAllowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 3030
          protocol: TCP
{{- end }}
{{- end }}
