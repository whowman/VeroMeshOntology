# VeroMesh on Kubernetes: the VeroMesh service (REST API, validation,
# provenance) and its knowledge graph (Apache Jena Fuseki, TDB2).
#
# DataHub is not part of this chart. Install it from its official charts with
# the overlays in deploy/helm/datahub/, then point api.datahub.gmsUrl at it.
# Every value is checked against values.schema.json at install time.

nameOverride: ""
fullnameOverride: ""

# Pull secrets for a private registry, e.g. [{name: my-registry}]
imagePullSecrets: []

serviceAccount:
  create: true
  # Defaults to the release's full name when empty.
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------- VeroMesh service
api:
  replicaCount: 1
  image:
    repository: veromesh/service
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  datahub:
    # DataHub GMS inside the cluster. With the official chart installed as
    # release "datahub" in the same namespace, this is the default.
    gmsUrl: http://datahub-datahub-gms:8080
    # DataHub personal access token. Prefer existingSecret in production;
    # a token given here is stored in a Secret created by this chart.
    token: ""
    existingSecret: ""
    existingSecretKey: token

  # Instance IRIs for model entities loaded from workbooks, one per customer install.
  instanceBase: "urn:veromesh:org:"

  # Sign-in (OpenID Connect). Every route but /health and the docs needs a
  # bearer token from this issuer; the service will not start without it.
  # Entra ID: issuer https://login.microsoftonline.com/<tenant ID>/v2.0 (the
  # API's app registration set to v2 access tokens), audience the API's
  # application (client) ID or Application ID URI, roles from app roles
  # (rolesClaim "roles", rolePrefix e.g. "VeroMesh."). Keycloak: issuer
  # https://<host>/realms/<realm>, rolesClaim "realm_access.roles".
  # Roles: admin, steward, connector, reader, agent (see service/README.md).
  auth:
    issuer: ""
    # One or more, comma-separated.
    audience: ""
    rolesClaim: roles
    rolePrefix: ""
    # Default: from the issuer's discovery document.
    jwksUrl: ""
    # Development and CI only: no sign-in, every request acts as an administrator.
    disabled: false
    # The steward screen (/steward) signs people in in the browser: a public (single-page
    # application) registration's client ID, with redirect URIs https://<host>/steward/ and
    # https://<host>/admin/ (Administration), and the
    # scope it asks for (Entra ID: api://<the API's ID URI>/access_as_user).
    uiClientId: ""
    uiScope: "openid profile email"

  # The decision log: an append-only, hash-chained table in its own PostgreSQL
  # database (the service creates it). Give the database's URL,
  # postgresql://user:password@host:5432/database?sslmode=require, in a Secret
  # you create. Unset, the log is kept in memory and lost on restart:
  # development only.
  decisionLog:
    existingSecret: ""
    key: url

  # The customer's time zone (an IANA name such as America/New_York): the calendar
  # for authority validity dates, per-day limits and measures periods. Timestamps
  # are stored in UTC either way.
  timeZone: UTC

  # Where people reach this install (https://ontology.example.com), for the links in
  # notices to owners. Unset: https://<ingress host> when the ingress is on, else no link.
  publicUrl: ""

  # Need to know: the People fields readers and agents do not see, comma-separated.
  # Empty: email, employeeId and reportsTo (they see names and roles filled); add "name"
  # to withhold names too. agentPersonalFields, when set, applies to agents instead.
  needToKnow:
    personalFields: ""
    agentPersonalFields: ""

  # The Teams channel for notices to owners (deploy/teams/README.md): the bot's Entra
  # application ID, the customer's tenant, and a Secret holding the bot's client secret
  # (key app-password). Unset: owners are told by email only.
  teams:
    appId: ""
    tenantId: ""
    existingSecret: ""

  # The MCP gateway (agents call their tools through /gateway/mcp; each call is checked
  # first). Its upstream servers are set by an administrator (PUT /api/v1/gateway/settings);
  # their tokens come from this Secret: each key becomes an environment variable, named
  # by a target's secretEnv (e.g. GATEWAY_ERP_TOKEN: "Bearer ..."). See docs/gateway.md.
  gateway:
    existingSecret: ""

  # The usage report: every install makes one a month, signed with its own key and
  # kept beside the decision log; with a mail adapter set up (on the steward screen's
  # Usage page in Administration) it is also sent to VeroMesh. See service/README.md, "Usage report".
  usage:
    installId: ""          # empty: one is generated and kept on first use
    customerName: ""
    hosting: self-hosted   # or hosted (VeroMesh runs the install)
    licensedTier: ""       # small, medium, large or extra-large, until the licence file
    # The install's Ed25519 signing key (PEM, PKCS#8). Empty existingSecret: the chart
    # makes one and keeps it across upgrades and uninstalls.
    signingKey:
      existingSecret: ""
      key: signing-key.pem
    # A Secret with the mail adapter's secrets, if it needs any: keys smtp-password
    # and/or m365-client-secret (the rest of the mail settings is set on the Usage page).
    mailSecret: ""

  # The licence VeroMesh issued for this install (a signed JSON document), in a Secret
  # you create from the file: kubectl create secret generic veromesh-licence
  # --from-file=licence.json. Unset, an administrator loads it on the Administration
  # page instead. Without any licence the install runs for 30 days, then goes read-only.
  licence:
    existingSecret: ""
    key: licence.json

  # Extra environment variables for the service, as name: value.
  env: {}

  service:
    type: ClusterIP
    port: 8700

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: veromesh.example.com
    # e.g. [{secretName: veromesh-tls, hosts: [veromesh.example.com]}]
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------- knowledge graph
# One Fuseki takes all writes (the writer); with replication on, read replicas
# follow it through Kafka and serve the service's reads while the writer is
# down or restarting. See deploy/helm/README.md, "Replication".
fuseki:
  # Set to false to use a store you run yourself (see store.url).
  enabled: true
  image:
    repository: veromesh/fuseki
    tag: "6.2.0"
    pullPolicy: IfNotPresent
  # TDB2 dataset name; the service reads and writes /<dataset>.
  dataset: veromesh
  javaOpts: "-Xmx1g"

  persistence:
    enabled: true
    size: 10Gi
    # Empty: the cluster's default storage class.
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 2Gi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  # Empty: with replication on, the writer and replicas prefer different nodes.
  affinity: {}

  replication:
    # Off: a single Fuseki, as in the local stack.
    enabled: true
    # Read replicas besides the writer. Each holds a full copy of the model and
    # uses fuseki.persistence, fuseki.resources and fuseki.javaOpts like the writer.
    replicas: 2
    kafka:
      # DataHub's prerequisites chart (release "prerequisites", same namespace)
      # runs Kafka here. It must allow transactions; see deploy/helm/README.md.
      bootstrapServers: prerequisites-kafka:9092
      # Carries every change to the model. The writer creates it with one
      # partition and no retention limit (replicas rebuild from its start).
      topic: veromesh.graph
      # Replication factor when the writer creates the topic; 0: the broker's default.
      replicationFactor: 0
      # Secret with a key kafka.properties of Kafka client settings (TLS, SASL),
      # used by the writer and the replicas. Empty: plain connection.
      existingSecret: ""

# A SPARQL store outside this chart, used when fuseki.enabled is false, in the
# service's own notation: "fuseki:<dataset URL>", e.g.
# fuseki:http://fuseki.graph.svc:3030/veromesh
store:
  url: ""

# ---------------------------------------------------------------------------- backups
# A nightly backup of the knowledge graph and the decision log, encrypted to
# the customer's own public keys: nobody without the matching private key, us
# included, can read a backup. Restore with scripts/veromesh-backup.sh; see
# deploy/helm/README.md, "Backups and restore".
backup:
  enabled: true
  image:
    repository: veromesh/backup
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # Cron schedule, in api.timeZone.
  schedule: "17 2 * * *"
  # Backups kept; older ones are deleted after each successful backup.
  keep: 30
  # Read the graph from the writer (always current) or from the read replicas
  # (spares the writer; may be a moment behind). Replicas need replication on.
  graphFrom: writer

  encryption:
    # Off only for development: backups would hold people's names in the clear.
    enabled: true
    # The customer's public keys, from `age-keygen` (age1...) or SSH (ssh-ed25519 ...).
    # Any one of the matching private keys can restore. Keep the private keys
    # out of the cluster: a key held offline, or in the customer's own vault.
    recipients: []

  # Where backups go; one of the two is required.
  # Object storage (production): Azure Blob, S3, Google Cloud Storage, ... A
  # Secret with a key rclone.conf, and the remote path in rclone.remote, e.g.
  # "azure:veromesh-backups/prod". The bucket's own encryption can use a
  # customer-managed key as well.
  rclone:
    existingSecret: ""
    remote: ""
  # Or a PersistentVolumeClaim you create (a pilot, or a test: not off-site).
  # Created outside the release, so backups outlive it.
  volume:
    existingClaim: ""

  # Scratch space for one backup (the compressed, encrypted files before upload).
  workSize: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

# ---------------------------------------------------------------------------- network
networkPolicy:
  # Fuseki has no authentication, so only the VeroMesh service (and the backup
  # job) may reach the writer and the replicas.
  # Needs a CNI that enforces NetworkPolicy (Calico, Cilium, cloud CNIs).
  enabled: true
  # Further pods allowed to reach Fuseki, e.g.
  # [{podSelector: {matchLabels: {app: graph-explorer}}}]
  fusekiAllowFrom: []

# ---------------------------------------------------------------------------- encryption in transit
# Mutual TLS between every VeroMesh pod through Istio's ambient mesh, with
# workload certificates issued by cert-manager (istio-csr) and signed by the
# customer's OpenBao, so every certificate is managed in one place. Install
# OpenBao, cert-manager, istio-csr and Istio first: see deploy/mesh/README.md.
mesh:
  enabled: false
  # Plain-text connections to the service: STRICT refuses them, so whatever
  # calls the API (ingress controller, connectors, agents' gateway) must be in
  # the mesh too. PERMISSIVE accepts both, while those callers are enrolled.
  # Fuseki is always STRICT.
  apiMtls: STRICT
  # The mesh's trust domain (Istio's meshConfig.trustDomain).
  trustDomain: cluster.local
