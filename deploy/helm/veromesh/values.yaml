# VeroMesh on Kubernetes: the VeroMesh service (REST API, validation,
# provenance) and its knowledge graph (Apache Jena Fuseki, TDB2).
#
# DataHub is not part of this chart. Install it from its official charts with
# the overlays in deploy/helm/datahub/, then point api.datahub.gmsUrl at it.
# Every value is checked against values.schema.json at install time.

nameOverride: ""
fullnameOverride: ""

# Pull secrets for a private registry, e.g. [{name: my-registry}]
imagePullSecrets: []

serviceAccount:
  create: true
  # Defaults to the release's full name when empty.
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------- VeroMesh service
api:
  replicaCount: 1
  image:
    repository: veromesh/service
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  datahub:
    # DataHub GMS inside the cluster. With the official chart installed as
    # release "datahub" in the same namespace, this is the default.
    gmsUrl: http://datahub-datahub-gms:8080
    # DataHub personal access token. Prefer existingSecret in production;
    # a token given here is stored in a Secret created by this chart.
    token: ""
    existingSecret: ""
    existingSecretKey: token

  # Instance IRIs for model entities loaded from workbooks, one per customer install.
  instanceBase: "urn:veromesh:org:"

  # Extra environment variables for the service, as name: value.
  env: {}

  service:
    type: ClusterIP
    port: 8700

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: veromesh.example.com
    # e.g. [{secretName: veromesh-tls, hosts: [veromesh.example.com]}]
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------- knowledge graph
# One Fuseki takes all writes (the writer); with replication on, read replicas
# follow it through Kafka and serve the service's reads while the writer is
# down or restarting. See deploy/helm/README.md, "Replication".
fuseki:
  # Set to false to use a store you run yourself (see store.url).
  enabled: true
  image:
    repository: veromesh/fuseki
    tag: "6.2.0"
    pullPolicy: IfNotPresent
  # TDB2 dataset name; the service reads and writes /<dataset>.
  dataset: veromesh
  javaOpts: "-Xmx1g"

  persistence:
    enabled: true
    size: 10Gi
    # Empty: the cluster's default storage class.
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 2Gi

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  # Empty: with replication on, the writer and replicas prefer different nodes.
  affinity: {}

  replication:
    # Off: a single Fuseki, as in the local stack.
    enabled: true
    # Read replicas besides the writer. Each holds a full copy of the model and
    # uses fuseki.persistence, fuseki.resources and fuseki.javaOpts like the writer.
    replicas: 2
    kafka:
      # DataHub's prerequisites chart (release "prerequisites", same namespace)
      # runs Kafka here. It must allow transactions; see deploy/helm/README.md.
      bootstrapServers: prerequisites-kafka:9092
      # Carries every change to the model. The writer creates it with one
      # partition and no retention limit (replicas rebuild from its start).
      topic: veromesh.graph
      # Replication factor when the writer creates the topic; 0: the broker's default.
      replicationFactor: 0
      # Secret with a key kafka.properties of Kafka client settings (TLS, SASL),
      # used by the writer and the replicas. Empty: plain connection.
      existingSecret: ""

# A SPARQL store outside this chart, used when fuseki.enabled is false, in the
# service's own notation: "fuseki:<dataset URL>", e.g.
# fuseki:http://fuseki.graph.svc:3030/veromesh
store:
  url: ""

# ---------------------------------------------------------------------------- network
networkPolicy:
  # Fuseki has no authentication, so only the VeroMesh service may reach the
  # writer and the replicas.
  # Needs a CNI that enforces NetworkPolicy (Calico, Cilium, cloud CNIs).
  enabled: true
  # Further pods allowed to reach Fuseki, e.g. a backup job:
  # [{podSelector: {matchLabels: {app: fuseki-backup}}}]
  fusekiAllowFrom: []
