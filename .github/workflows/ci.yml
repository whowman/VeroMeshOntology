name: CI

# Every job runs the regression harness (scripts/test.sh), the same command
# developers run locally, so CI and a laptop test exactly the same things.
# Suites and tiers are defined in tests/harness/suites.py.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quick:
    # Lint, unit, ontology rules, contract snapshots, licenses, scripts, compose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test.sh quick --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-quick
          path: .build/test-results/

  quick-local:
    # The same tier through the --local (virtualenv) path, so both ways of
    # running the harness stay working.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/test.sh quick --local --strict

  integration:
    # Service and connector suites on a real Fuseki; container images.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test.sh fuseki images datahub-frontend --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-integration
          path: .build/test-results/

  datahub-model:
    # Compiles the custom aspect inside DataHub's Gradle build at the pinned tag.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/test.sh datahub-model --strict
      - uses: actions/upload-artifact@v4
        with:
          name: veromesh-ontology-model
          path: datahub-model/dist/*.zip

  e2e:
    # Starts the full local stack exactly as a developer would (Docker-only
    # plugin build), then runs the end-to-end suites against it.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free disk space for DataHub images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - run: BUILD_IN_DOCKER=1 scripts/test.sh e2e --start-stack --strict
      - name: Screenshots of the UIs (for review)
        if: always()
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          python tests/e2e/screenshots.py .build/test-results/screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-e2e
          path: .build/test-results/
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a
          set +e
          for c in $(docker ps -a --format '{{.Names}}'); do echo "=== $c"; docker logs --tail 80 "$c" 2>&1 | grep -v '^\s*at '; done
          GMS=$(docker ps -a --format '{{.Names}}' | grep -m1 datahub-gms)
          echo "=== GMS plugin/registry lines"
          docker logs "$GMS" 2>&1 | grep -i -E 'registry|plugin' | grep -v '^\s*at ' | tail -60
          echo "=== GMS errors"
          docker logs "$GMS" 2>&1 | grep -E 'ERROR|Exception|Caused by' | grep -v SsoManager | tail -60
