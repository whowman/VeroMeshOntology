[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veromesh"
version = "0.1.0"
description = "Veromesh ontology service: OWL/RDF ontologies bound to DataHub metadata"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Veromesh" }]
dependencies = [
    "acryl-datahub>=1.7,<1.9",  # Apache-2.0
    "pyoxigraph>=0.5,<0.6",     # MIT OR Apache-2.0
    "fastapi>=0.115",           # MIT
    "uvicorn[standard]>=0.30",  # BSD-3-Clause
    "httpx>=0.27",              # BSD-3-Clause
    "pydantic-settings>=2.4",   # MIT
    "rdflib>=7.1,<8",           # BSD-3-Clause
    "pyshacl>=0.40,<0.41",      # Apache-2.0
    "pyjwt[crypto]>=2.8,<3",    # MIT (cryptography: Apache-2.0 OR BSD-3-Clause)
    "mcp>=1.20,<2",             # MIT; the MCP server at /mcp (Streamable HTTP)
    "pg8000>=1.31,<2",          # BSD-3-Clause (scramp: MIT-0); the decision log. Not psycopg: LGPL needs review
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pip-licenses>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/veromesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]  # tests may share helpers (test_mcp uses test_auth's sign-in helpers)

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter wraps code; long user-facing strings stay readable
