[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veromesh"
version = "0.1.0"
description = "Veromesh ontology service: OWL/RDF ontologies bound to DataHub metadata"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Veromesh" }]
dependencies = [
    "acryl-datahub>=1.7,<1.9",  # Apache-2.0
    "pyoxigraph>=0.5,<0.6",     # MIT OR Apache-2.0
    "fastapi>=0.115",           # MIT
    "uvicorn[standard]>=0.30",  # BSD-3-Clause
    "httpx>=0.27",              # BSD-3-Clause
    "pydantic-settings>=2.4",   # MIT
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pip-licenses>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/veromesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
