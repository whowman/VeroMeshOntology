[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veromesh-loader"
version = "0.1.0"
description = "Load the VeroMesh organizational model from Excel workbooks through the VeroMesh REST API"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "openpyxl>=3.1,<4",  # MIT
    "httpx>=0.27",       # BSD-3-Clause
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
veromesh-loader = "veromesh_loader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veromesh_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
